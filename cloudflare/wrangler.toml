name = "editor-plus-plus-api"
main = "src/index.ts"
compatibility_date = "2026-11-13"

[vars]
ACCESS_TEAM_DOMAIN = "YOUR-TEAM.cloudflareaccess.com"
ACCESS_AUD = "YOUR_CLOUDFLARE_ACCESS_APPLICATION_AUD"

[[d1_databases]]
binding = "DB"
database_name = "editor-plus-plus"
database_id = "f9d4de93-b970-4c59-b0a9-49fce3ae2645"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "EditorRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EditorRoom"]
